<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跨境物流自助查询</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <strong>跨境物流自助查询</strong>
        <span>只读查询</span>
      </header>

      <section id="loginPanel" class="login-panel" hidden aria-labelledby="loginTitle">
        <p class="eyebrow">客户登录</p>
        <h2 id="loginTitle">登录后查询所属客户数据</h2>
        <form id="loginForm" class="login-form">
          <label for="loginUsername">账号</label>
          <input id="loginUsername" autocomplete="username" required />
          <label for="loginPassword">密码</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
          <button type="submit">登录</button>
        </form>
        <p id="loginStatus" class="input-hint" aria-live="polite"></p>
        <button id="logoutButton" type="button" hidden>退出登录</button>
      </section>

      <section class="lookup-panel" aria-labelledby="pageTitle">
        <p class="eyebrow">批量运单查询</p>
        <h1 id="pageTitle">输入多个单号，统一查看结果</h1>
        <form id="lookupForm" class="lookup-form">
          <label for="waybillNumbers">运单号</label>
          <textarea id="waybillNumbers" rows="6" autocomplete="off" placeholder="例如：&#10;MO10067690&#10;MO10068327"></textarea>
          <p id="inputHint" class="input-hint">支持按换行、英文逗号或中文逗号分隔，单次最多 50 个单号。</p>
          <button type="submit">批量查询</button>
        </form>
      </section>

      <section class="assistant-panel" aria-labelledby="assistantTitle">
        <p class="eyebrow">AI 查询助手</p>
        <h2 id="assistantTitle">直接描述你要查的内容</h2>
        <form id="assistantForm" class="assistant-form">
          <label for="assistantMessage">查询需求</label>
          <textarea id="assistantMessage" rows="3" autocomplete="off" placeholder="例如：帮我查 MO10068327 和 MO10084025 的物流"></textarea>
          <p class="input-hint">助手只会调用已配置的只读查询工作流，不会编造金额、重量或物流状态。</p>
          <button type="submit">发送查询</button>
        </form>
        <div id="assistantResult" class="assistant-result" aria-live="polite"></div>
      </section>

      <section id="lookupResult" class="result-panel" aria-live="polite">
        <p class="empty">请输入运单号开始查询。</p>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
