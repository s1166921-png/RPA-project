<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跨境物流自助查询</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar"><strong>跨境物流自助查询</strong><span>只读查询</span></header>
      <section class="lookup-panel">
        <p class="eyebrow">运单直查</p>
        <h1>输入单号，查看运输信息</h1>
        <form id="lookupForm" class="lookup-form">
          <label for="waybillNumber">运单号</label>
          <input id="waybillNumber" autocomplete="off" placeholder="例如：MO10067690" />
          <button type="submit">查询</button>
        </form>
      </section>
      <section id="lookupResult" class="result-panel" aria-live="polite"><p>请输入运单号开始查询。</p></section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
